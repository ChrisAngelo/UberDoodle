
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FEFEFD" />
    <title>DoodleMinds Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              highlight: '#D66A3A', // Golpo orange
              secondary: '#0D9488', // Teal
              paper: '#FEFEFD', // Golpo paper
              ink: '#1B1009',
              tan: '#CFAF8A',
              accent: '#D66A3A',
              umber: '#7A5A3F',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              doodle: ['Comic Sans MS', 'Chalkboard SE', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-paper dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased overflow-hidden transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
